<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10152f">
  <title>Cosmic Quiz — Explore the Solar System</title>
  <style>
    :root {
      color-scheme: dark light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      --page: #10152f;
      --card: #1b2245;
      --card-raised: #242d58;
      --text: #f7f5ff;
      --muted: #b7bddb;
      --accent: #a68bff;
      --accent-bright: #c1adff;
      --border: rgb(255 255 255 / 13%);
      --correct: #45d69b;
      --correct-bg: rgb(69 214 155 / 15%);
      --wrong: #ff7188;
      --wrong-bg: rgb(255 113 136 / 14%);
      --shadow: 0 24px 70px rgb(0 0 0 / 35%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --page: #f2f2ff;
        --card: #fff;
        --card-raised: #f5f3ff;
        --text: #202044;
        --muted: #626481;
        --accent: #7352df;
        --accent-bright: #5c3dca;
        --border: rgb(54 48 106 / 14%);
        --correct: #13885e;
        --correct-bg: #e2f8ef;
        --wrong: #c83855;
        --wrong-bg: #fff0f2;
        --shadow: 0 24px 70px rgb(43 39 91 / 12%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 10%, rgb(123 93 236 / 19%), transparent 32rem),
        radial-gradient(ellipse at 88% 90%, rgb(44 195 180 / 12%), transparent 28rem),
        var(--page);
      transition: background-color 180ms ease, color 180ms ease;
    }

    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      background-image: radial-gradient(1px 1px at 14% 24%, var(--muted) 50%, transparent),
        radial-gradient(2px 2px at 82% 18%, var(--muted) 50%, transparent),
        radial-gradient(1px 1px at 71% 73%, var(--muted) 50%, transparent),
        radial-gradient(1px 1px at 28% 83%, var(--muted) 50%, transparent);
      opacity: .35;
    }

    .stars::before { transform: translate(24px, 36px); opacity: .55; }
    .stars::after { transform: translate(-18px, -25px); opacity: .35; }

    main {
      width: min(100%, 720px);
      position: relative;
    }

    .brand {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
    }

    .quiz-card {
      min-height: 460px;
      padding: clamp(24px, 6vw, 48px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      position: relative;
    }

    .quiz-card::before {
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 3px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--accent), #48d5cc, transparent);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-bright);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }
    h1, h2 { letter-spacing: -.035em; }
    h1 { max-width: 540px; margin-bottom: 16px; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: .98; }
    h2 { margin-bottom: 24px; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.25; }
    .intro-copy, .result-copy { max-width: 490px; color: var(--muted); font-size: 1.05rem; line-height: 1.7; }

    .planet {
      display: grid;
      width: 92px;
      height: 92px;
      margin: 4px 0 24px;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 27%, #ffe6a5, #ff9a74 43%, #d24e9c 78%);
      box-shadow: 0 0 48px rgb(255 129 170 / 26%);
      font-size: 2.8rem;
      animation: float 4s ease-in-out infinite;
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(115deg, #8669ef, #6d57d8);
      box-shadow: 0 8px 24px rgb(114 85 220 / 25%);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 140ms ease, filter 140ms ease;
    }

    .button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .button:active { transform: translateY(0); }
    .button:focus-visible, .answer:focus-visible {
      outline: 3px solid #45d5d0;
      outline-offset: 4px;
    }
    .button:disabled { cursor: default; opacity: .55; transform: none; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .counter, .score-pill {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 800;
    }

    .score-pill {
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: var(--card-raised);
      white-space: nowrap;
    }

    .progress-track {
      height: 9px;
      margin-bottom: 30px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--card-raised);
    }

    .progress-value {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a68bff, #48d5cc);
      transition: width 350ms ease;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      background: var(--card-raised);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      line-height: 1.35;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
    .answer:disabled { cursor: default; }
    .answer-letter {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      border-radius: 10px;
      color: var(--accent-bright);
      background: var(--card);
      font-size: .82rem;
    }

    .answer.correct { border-color: var(--correct); background: var(--correct-bg); animation: pop 360ms ease; }
    .answer.incorrect { border-color: var(--wrong); background: var(--wrong-bg); animation: shake 360ms ease; }
    .answer.correct .answer-letter { color: var(--correct); }
    .answer.incorrect .answer-letter { color: var(--wrong); }
    .answer.muted { opacity: .58; }

    .feedback {
      min-height: 32px;
      margin: 16px 0 0;
      font-weight: 800;
      line-height: 1.5;
    }
    .feedback.good { color: var(--correct); }
    .feedback.bad { color: var(--wrong); }

    .actions {
      display: flex;
      min-height: 54px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .hidden { display: none !important; }

    .result-emoji {
      margin: 8px 0 12px;
      font-size: clamp(5.5rem, 18vw, 9rem);
      line-height: 1;
      animation: result-arrive 700ms cubic-bezier(.2, 1.5, .5, 1) both;
    }

    .result-score {
      margin: 10px 0 16px;
      color: var(--accent-bright);
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 900;
      letter-spacing: -.05em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    @keyframes pop { 0% { transform: scale(.88); } 65% { transform: scale(1.06); } 100% { transform: scale(1); } }
    @keyframes result-arrive {
      0% { opacity: 0; transform: translateY(22px) scale(.55) rotate(-12deg); }
      65% { opacity: 1; transform: translateY(-6px) scale(1.12) rotate(4deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @media (max-width: 540px) {
      body { padding: 20px 12px; }
      .quiz-card { min-height: 0; border-radius: 22px; }
      .answers { grid-template-columns: 1fr; }
      .answer { min-height: 58px; }
      .topline { margin-bottom: 16px; }
      .progress-track { margin-bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <p class="brand">✦ Cosmic Quiz ✦</p>
    <section class="quiz-card" aria-labelledby="screen-title">
      <div id="welcome">
        <p class="eyebrow">Your mission starts here</p>
        <div class="planet" aria-hidden="true">🪐</div>
        <h1 id="screen-title" tabindex="-1">How well do you know space?</h1>
        <p class="intro-copy">Blast off through 10 quick questions about planets, stars, and the wider universe. Ready to find out if you’re a cosmic genius?</p>
        <button class="button" id="start-button" type="button">Start exploring <span aria-hidden="true">→</span></button>
      </div>

      <div id="quiz" class="hidden">
        <div class="topline">
          <span class="counter" id="question-counter">Question 1 of 10</span>
          <span class="score-pill" id="score-counter" aria-live="polite">⭐ Score: 0</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress">
          <div class="progress-value" id="progress-value"></div>
        </div>
        <p class="eyebrow" id="category"></p>
        <h2 id="question-title" tabindex="-1"></h2>
        <div class="answers" id="answers" role="group" aria-labelledby="question-title"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="actions">
          <button class="button hidden" id="next-button" type="button">Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>

      <div id="results" class="hidden" aria-live="polite">
        <p class="eyebrow">Mission complete</p>
        <div class="result-emoji" id="result-emoji" aria-hidden="true">🚀</div>
        <h2 id="result-title" tabindex="-1">A stellar journey!</h2>
        <p class="result-score" id="result-score"></p>
        <p class="result-copy" id="result-copy"></p>
        <button class="button" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
      </div>
    </section>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const questions = [
        {
          category: "Our solar system",
          question: "Which planet is known as the Red Planet?",
          options: ["Venus", "Mars", "Jupiter", "Mercury"],
          answer: 1,
          fact: "Mars looks rusty because iron-rich dust on its surface has oxidized."
        },
        {
          category: "Planet facts",
          question: "Which planet has the most prominent ring system?",
          options: ["Neptune", "Earth", "Saturn", "Uranus"],
          answer: 2,
          fact: "Saturn’s beautiful rings are made mostly of ice and rocky debris."
        },
        {
          category: "The Moon",
          question: "About how long does the Moon take to orbit Earth?",
          options: ["One day", "One week", "One month", "One year"],
          answer: 2,
          fact: "One orbit takes about 27.3 days; its phases repeat about every 29.5 days."
        },
        {
          category: "Star stuff",
          question: "What is the closest star to Earth?",
          options: ["Sirius", "The Sun", "Proxima Centauri", "Polaris"],
          answer: 1,
          fact: "Our Sun is a star, and it is about 150 million kilometers from Earth."
        },
        {
          category: "Deep space",
          question: "What is the name of the galaxy that contains our solar system?",
          options: ["Andromeda", "Whirlpool Galaxy", "Sombrero Galaxy", "Milky Way"],
          answer: 3,
          fact: "Our solar system sits in one of the Milky Way’s spiral arms."
        },
        {
          category: "Planet facts",
          question: "Which planet is the largest in our solar system?",
          options: ["Jupiter", "Saturn", "Earth", "Neptune"],
          answer: 0,
          fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
        },
        {
          category: "Space exploration",
          question: "What was the first human-made object to reach the Moon?",
          options: ["Apollo 11", "Luna 2", "Voyager 1", "Sputnik 1"],
          answer: 1,
          fact: "The Soviet spacecraft Luna 2 impacted the Moon in 1959."
        },
        {
          category: "Our solar system",
          question: "Which planet rotates on its side?",
          options: ["Mars", "Venus", "Uranus", "Mercury"],
          answer: 2,
          fact: "Uranus has an extreme axial tilt of about 98 degrees."
        },
        {
          category: "The universe",
          question: "What is a light-year a measure of?",
          options: ["Time", "Brightness", "Distance", "Speed"],
          answer: 2,
          fact: "A light-year is the distance light travels in one year: about 9.46 trillion km."
        },
        {
          category: "Space exploration",
          question: "What do astronauts wear to protect themselves during a spacewalk?",
          options: ["A flight suit", "A spacesuit", "A pressure coat", "A thermal blanket"],
          answer: 1,
          fact: "Spacesuits provide oxygen, pressure, and temperature control outside a spacecraft."
        }
      ];

      const welcome = document.getElementById("welcome");
      const quiz = document.getElementById("quiz");
      const results = document.getElementById("results");
      const questionCounter = document.getElementById("question-counter");
      const scoreCounter = document.getElementById("score-counter");
      const progress = document.getElementById("progress");
      const progressValue = document.getElementById("progress-value");
      const category = document.getElementById("category");
      const questionTitle = document.getElementById("question-title");
      const answers = document.getElementById("answers");
      const feedback = document.getElementById("feedback");
      const nextButton = document.getElementById("next-button");
      const announcement = document.getElementById("announcement");
      let questionIndex = 0;
      let score = 0;
      let hasAnswered = false;

      function showQuestion() {
        const item = questions[questionIndex];
        hasAnswered = false;
        questionCounter.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
        category.textContent = item.category;
        questionTitle.textContent = item.question;
        progress.setAttribute("aria-valuenow", String(questionIndex));
        progressValue.style.width = `${(questionIndex / questions.length) * 100}%`;
        feedback.textContent = "";
        feedback.className = "feedback";
        nextButton.classList.add("hidden");
        answers.replaceChildren();

        item.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.dataset.index = String(index);
          button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
          button.addEventListener("click", () => chooseAnswer(index));
          answers.append(button);
        });
        questionTitle.focus();
      }

      function chooseAnswer(selectedIndex) {
        if (hasAnswered) return;
        hasAnswered = true;
        const item = questions[questionIndex];
        const correct = selectedIndex === item.answer;
        const buttons = [...answers.querySelectorAll("button")];
        buttons.forEach((button, index) => {
          button.disabled = true;
          if (index === item.answer) button.classList.add("correct");
          else if (index === selectedIndex) button.classList.add("incorrect");
          else button.classList.add("muted");
        });
        progress.setAttribute("aria-valuenow", String(questionIndex + 1));
        progressValue.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;

        if (correct) {
          score += 1;
          feedback.textContent = `✨ Correct! ${item.fact}`;
          feedback.classList.add("good");
        } else {
          feedback.textContent = `Not quite! ${item.fact}`;
          feedback.classList.add("bad");
        }
        scoreCounter.textContent = `⭐ Score: ${score}`;
        announcement.textContent = `${correct ? "Correct." : "Incorrect."} ${item.fact} Score: ${score}.`;
        nextButton.textContent = questionIndex === questions.length - 1 ? "See your results" : "Next question";
        nextButton.classList.remove("hidden");
        nextButton.focus();
      }

      function showResults() {
        quiz.classList.add("hidden");
        results.classList.remove("hidden");
        const percentage = score / questions.length;
        let emoji, title, copy;
        if (percentage === 1) {
          emoji = "🏆";
          title = "Out of this world!";
          copy = "A perfect cosmic score. The universe has no secrets from you!";
        } else if (percentage >= 0.7) {
          emoji = "🌟";
          title = "Stellar work!";
          copy = "You know your way around the cosmos. Keep reaching for the stars!";
        } else if (percentage >= 0.4) {
          emoji = "🛸";
          title = "Nice space trip!";
          copy = "You’re on your way to becoming a space expert. There’s always more to explore!";
        } else {
          emoji = "🌙";
          title = "A new explorer!";
          copy = "Every great space journey begins somewhere. Ready for another orbit?";
        }
        document.getElementById("result-emoji").textContent = emoji;
        document.getElementById("result-title").textContent = title;
        const resultScore = document.getElementById("result-score");
        const finalScore = score;
        const duration = 1100;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduceMotion) {
          resultScore.textContent = `${finalScore} / ${questions.length}`;
        } else {
          resultScore.textContent = `0 / ${questions.length}`;
          const startedAt = performance.now();
          function countScore(now) {
            const progress = Math.min((now - startedAt) / duration, 1);
            const displayedScore = Math.round(progress * finalScore);
            resultScore.textContent = `${displayedScore} / ${questions.length}`;
            if (progress < 1) requestAnimationFrame(countScore);
          }
          requestAnimationFrame(countScore);
        }
        document.getElementById("result-copy").textContent = copy;
        document.getElementById("result-title").focus();
      }

      document.getElementById("start-button").addEventListener("click", () => {
        welcome.classList.add("hidden");
        quiz.classList.remove("hidden");
        showQuestion();
      });

      nextButton.addEventListener("click", () => {
        questionIndex += 1;
        if (questionIndex === questions.length) showResults();
        else showQuestion();
      });

      document.getElementById("restart-button").addEventListener("click", () => {
        questionIndex = 0;
        score = 0;
        scoreCounter.textContent = "⭐ Score: 0";
        results.classList.add("hidden");
        welcome.classList.add("hidden");
        quiz.classList.remove("hidden");
        showQuestion();
      });
    })();
  </script>
</body>
</html>
